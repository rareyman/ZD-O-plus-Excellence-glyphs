<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ZD-O+ Excellence — Glyph Preview</title>
  <style>
    body { font-family: Inter, system-ui, Arial; background:#0f1113; color:#ddd; padding:24px; }
    .row { display:flex; gap:24px; align-items:center; margin-bottom:20px; }
    .card { background:#16181a; padding:12px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.6); }
    img.glyph { width:48px; height:48px; display:block; }
    .label { font-size:12px; color:#9aa0a6; margin-top:6px; text-align:center; }
    .controller { width:320px; height:160px; background:#0b0c0d; display:block; }
  </style>
</head>
<body>
  <h1>ZD-O+ Excellence — Glyph Preview</h1>
  <p>Preview of glyphs at common Steam sizes. Open this file in a browser to inspect spacing and weight.</p>

  <div class="row">
    <div class="card">
      <img class="glyph" src="assets/shared_button_a.svg" alt="A">
      <div class="label">A</div>
    </div>
    <div class="card">
      <img class="glyph" src="assets/shared_button_b.svg" alt="B">
      <div class="label">B</div>
    </div>
    <div class="card">
      <img class="glyph" src="assets/shared_button_x.svg" alt="X">
      <div class="label">X</div>
    </div>
    <div class="card">
      <img class="glyph" src="assets/shared_button_y.svg" alt="Y">
      <div class="label">Y</div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <img class="glyph" src="assets/button_plus.svg" alt="Plus">
      <div class="label">Plus</div>
    </div>
    <div class="card">
      <img class="glyph" src="assets/button_minus.svg" alt="Minus">
      <div class="label">Minus</div>
    </div>
    <div class="card">
      <img class="glyph" src="assets/home-circle.svg" alt="Home">
      <div class="label">Home (user)</div>
    </div>
  </div>

  <h2>Controller Background</h2>
  <div class="card" style="padding:16px; width:360px;">
    <img class="controller" src="assets/zd-oplus-excellence-controller.svg" alt="Controller">
  </div>

  <p style="margin-top:24px; font-size:13px; color:#9aa0a6">Open locally with: <code>open preview.html</code></p>
</body>
</html>
